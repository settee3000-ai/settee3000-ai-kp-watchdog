name: KP watchdog (settee-kp.ru)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site, alert and auto-reboot (Selectel) if down
        env:
          SEL_USER: ${{ secrets.SELECTEL_USERNAME }}
          SEL_PASS: ${{ secrets.SELECTEL_PASSWORD }}
          SEL_ACCOUNT: ${{ secrets.SELECTEL_ACCOUNT }}
          SEL_PROJECT: ${{ secrets.SELECTEL_PROJECT }}
          SEL_SERVER: ${{ secrets.SELECTEL_SERVER_ID }}
          SEL_REGION: ${{ secrets.SELECTEL_REGION }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE: https://settee-kp.ru/
        run: |
          set +e

          # 1) доступность сайта — 5 попыток
          alive=0
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE"); rc=$?
            if [ "$rc" = "0" ] && [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              alive=1; echo "check $i: HTTP $code — alive"; break
            fi
            echo "check $i: unreachable (rc=$rc code=$code)"; [ "$i" -lt 5 ] && sleep 20
          done

          # 2) при падении — авто-перезагрузка сервера через Selectel OpenStack API
          reboot_msg=""
          if [ "$alive" != "1" ]; then
            BODY=$(python3 -c "import os,json;print(json.dumps({'auth':{'identity':{'methods':['password'],'password':{'user':{'name':os.environ['SEL_USER'],'domain':{'name':os.environ['SEL_ACCOUNT']},'password':os.environ['SEL_PASS']}}},'scope':{'project':{'name':os.environ['SEL_PROJECT'],'domain':{'name':os.environ['SEL_ACCOUNT']}}}}}))")
            curl -s -D /tmp/h.txt -o /dev/null --max-time 25 -X POST "https://cloud.api.selcloud.ru/identity/v3/auth/tokens" -H "Content-Type: application/json" -d "$BODY"
            TOKEN=$(grep -i '^x-subject-token:' /tmp/h.txt | awk '{print $2}' | tr -d '\r\n')
            if [ -n "$TOKEN" ]; then
              rc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -X POST "https://$SEL_REGION.cloud.api.selcloud.ru/compute/v2.1/servers/$SEL_SERVER/action" -H "X-Auth-Token: $TOKEN" -H "Content-Type: application/json" -d '{"reboot":{"type":"HARD"}}')
              echo "selectel reboot http: $rc"
              if [ "$rc" = "202" ]; then
                reboot_msg="Отправлена автоперезагрузка сервера (Selectel) — поднимется через 1–3 мин. Если не поднялся — проверьте баланс в my.selectel.ru."
              else
                reboot_msg="Перезагрузка Selectel вернула код $rc. Проверьте сервер вручную в my.selectel.ru (и баланс)."
              fi
            else
              reboot_msg="Не удалось авторизоваться в Selectel API. Перезагрузите сервер вручную в my.selectel.ru и проверьте баланс."
            fi
          fi

          # 3) состояние (де-дуп оповещений)
          today=$(date -u +%F)
          pstatus=up; pdown=0; plast=""
          if [ -f state.txt ]; then read -r pstatus pdown plast < state.txt; fi
          [ -z "$pstatus" ] && pstatus=up; [ -z "$pdown" ] && pdown=0
          [ -z "$plast" ] && plast="1970-01-01"

          send() {
            IFS=','
            for c in $TG_CHAT; do
              [ -n "$c" ] && curl -s --max-time 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$c" --data-urlencode "text=$1" >/dev/null
            done
            unset IFS
          }

          if [ "$alive" = "1" ]; then
            nstatus=up; ndown=0
            if [ "$pstatus" = "down" ]; then
              send "🟢 settee-kp.ru снова работает — КП восстановлен."
            fi
          else
            nstatus=down; ndown=$((pdown + 1))
            if [ "$pstatus" != "down" ] || [ $((ndown % 12)) -eq 1 ]; then
              send "🔴 settee-kp.ru НЕ отвечает (проверка №$ndown). $reboot_msg"
            fi
          fi

          # 4) сохранить состояние; коммит при изменении или раз в сутки (чтобы Actions не отключились)
          echo "$nstatus $ndown $today" > state.txt
          if [ "$nstatus" != "$pstatus" ] || [ "$ndown" != "$pdown" ] || [ "$today" != "$plast" ]; then
            git config user.name "kp-watchdog"
            git config user.email "watchdog@settee.local"
            git add state.txt
            git commit -m "state: $nstatus down=$ndown ($today)" >/dev/null 2>&1
            git push >/dev/null 2>&1
          fi
          echo "done: alive=$alive status=$nstatus down=$ndown"
