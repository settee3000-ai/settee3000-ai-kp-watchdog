name: aeza-info
on:
  workflow_dispatch: {}
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Query Aeza (safe fields only)
        env:
          KEY: ${{ secrets.AEZA_API_KEY }}
        run: |
          set +e
          for url in "https://my.aeza.net/api/services" "https://my.aeza.net/api/services?type=vps" "https://my.aeza.net/api/vps" "https://my.aeza.net/api/user"; do
            echo "==== $url ===="
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 20 -H "X-API-Key: $KEY" "$url")
            echo "HTTP $code"
            python3 -c "import json; d=json.load(open('/tmp/r.json')); dd=(d.get('data') if isinstance(d,dict) else None); items=(dd.get('items') if isinstance(dd,dict) else None) or (d.get('items') if isinstance(d,dict) else None) or (dd if isinstance(dd,list) else None) or (d if isinstance(d,list) else None) or []; print('keys=', (list(d.keys()) if isinstance(d,dict) else type(d).__name__), '| count=', (len(items) if isinstance(items,list) else 0)); [print('SERVICE id=%s ip=%s product=%s status=%s expires=%s' % (s.get('id'), s.get('ip') or s.get('ipv4') or s.get('mainIp'), s.get('name') or (s.get('product') or {}).get('name') or s.get('tariff'), s.get('status') or s.get('state'), s.get('expiresAt') or s.get('paidTill') or s.get('expire'))) for s in (items if isinstance(items,list) else []) if isinstance(s,dict)]" 2>&1 | head -15
          done
